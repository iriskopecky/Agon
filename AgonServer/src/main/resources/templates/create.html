<!DOCTYPE html>
<html lang="en">
<head>
    <th:block th:replace="~{fragments/headCommon :: sharedHead}"></th:block>
    <script defer src="/js/backgroundAnim.js"></script>
    <link rel="stylesheet" th:href="@{/css/backgroundAnim.css}">
    <link rel="stylesheet" th:href="@{/css/create.css}">
    <th:block th:replace="~{fragments/mainHeader :: headScript}"></th:block>
    <th:block th:replace="~{fragments/appnav :: headScript}"></th:block>
</head>


<body>

<th:block th:replace="~{fragments/backgroundAnim :: bodyBlock}"></th:block>
<th:block th:replace="~{fragments/appnav :: bodyBlock}"></th:block>
<th:block th:replace="~{fragments/mainHeader :: bodyBlock}"></th:block>

<div id="create-teras-content" class="frostedLayer appContent">
    <form th:action="@{/user/create}"
          method="post"
          enctype="multipart/form-data">

        <div id="create-teras-top">
            <div class="create-input-label">
                <label for="create-name">Name</label>
                <input type="text" name="name" placeholder="Teras name" required id="create-name">
            </div>

            <div class="create-input-label">
                <label for="create-ispublic">Should this Teras be public?</label>
                <input type="checkbox" name="public" id="create-ispublic">
            </div>
        </div>

        <div class="create-textarea-label">
            <label for="create-desc">Description</label>
            <textarea name="description" placeholder="Description" required id="create-desc"></textarea>
        </div>

        <div class="create-input-label">
            <label for="create-file">File</label>
            <input type="file" name="source" accept=".java" required id="create-file">
        </div>

        <button>Create</button>
    </form>
</div>

</body>
</html>
