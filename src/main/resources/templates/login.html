<!DOCTYPE html>
<html lang="en">

<head>
    <th:block th:replace="~{fragments/headCommon :: sharedHead}"></th:block>
    <th:block th:replace="~{fragments/backgroundAnim :: headScript}"></th:block>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>

<body>

<th:block th:replace="~{fragments/backgroundAnim :: bodyBlock}"></th:block>

<div id="login-tile">
    <form th:action="@{/login}" method="post" class="frostedLayer">
        <p th:if="${param.error}">
            Invalid username or password.
        </p>

        <p th:if="${param.logout}">
            You have been logged out.
        </p>
        <input type="text"
               name="username"
               placeholder="Username"
               required>

        <input type="password"
               name="password"
               placeholder="Password"
               required>

        <button type="submit">Login</button>
    </form>
</div>



</body>
</html>
