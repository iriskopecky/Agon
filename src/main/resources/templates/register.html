<!DOCTYPE html>
<html lang="en">

<head>
    <th:block th:replace="~{fragments/headCommon :: sharedHead}"></th:block>
    <th:block th:replace="~{fragments/backgroundAnim :: headScript}"></th:block>
    <link rel="stylesheet" th:href="@{/css/register.css}">
    <script defer src="/js/register.js"></script>
</head>

<body>

<th:block th:replace="~{fragments/backgroundAnim :: bodyBlock}"></th:block>

<div id="register-tile">
    <form id="register-form" method="post" class="frostedLayer">
        <p th:if="${param.error}">
            The username selected already exists.
        </p>

        <input id="register-username"
               type="text"
               name="username"
               placeholder="Username"
               minlength="2"
               maxlength="32"
               required>

        <input id="register-password"
               type="password"
               name="password"
               placeholder="Password"
               minlength="8"
               maxlength="128"
               required>

        <input id="register-confirm-password"
               type="password"
               name="confirmpassword"
               placeholder="Confirm password"
               minlength="8"
               maxlength="128"
               required>

        <button type="submit">Register</button>
    </form>
</div>



</body>
</html>
